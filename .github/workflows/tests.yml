name: tests

on:
  push:
    # Every branch, not just main: SECURITY.md promises CI on every push, and a red feature
    # branch should say so before a pull request is opened or `main` is tagged.
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only token: CI only needs to check out the code.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          # python.org's macOS installer is on 3.14 now, so that's what new Mac users have
          - os: macos-latest
            python-version: "3.14"
    env:
      # Some tests build throwaway git repos; runners have no git identity configured.
      GIT_AUTHOR_NAME: CI
      GIT_AUTHOR_EMAIL: ci@example.invalid
      GIT_COMMITTER_NAME: CI
      GIT_COMMITTER_EMAIL: ci@example.invalid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install requirements
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Run offline tests (no network, no emails)
        run: python -m pytest tests/ -q

  security:
    name: security scans
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install scanners
        run: python -m pip install --disable-pip-version-check pip-audit bandit
      - name: Known-vulnerable dependencies (pip-audit)
        run: pip-audit -r requirements.txt
      - name: Static security analysis (bandit, medium severity and above)
        run: bandit -q -r core bots dashboard cli.py runner.py -ll
      - name: Installer and launcher lint (shellcheck, errors only)
        run: shellcheck --severity=error install.sh bin/sdr

  install:
    # The real one-line install, in a pseudo-terminal, the way a new user runs it: catches setup
    # problems the unit tests can't see (v1.2.2: macOS setup quit at its first question).
    name: install + setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install from this commit and answer setup's first question
        run: python scripts/install_smoke.py
