name: Bug report
description: Something doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste passwords, API keys, your `.env` file or real lead emails.**
        Replace them with made-up values like `jamie@example.com`.
        Found a security problem? Don't open an issue: follow [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Terminal output
      description: The command you ran and what it printed (remove anything private first).
      render: text
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `sdr version`
      placeholder: Automated SDR by Fred v1.2.3
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: sdr doctor --offline
      description: Paste its output. It never shows passwords.
      render: text
